<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>داشبورد نوبت‌ها</title>

<style>
  body {
    font-family: sans-serif;
    direction: rtl;
    background: #f0f2f5;
    padding: 20px;
  }

  h2 {
    text-align: center;
    margin-bottom: 20px;
  }

  .toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  input, select {
    padding: 10px;
    border: 1px solid #aaa;
    border-radius: 6px;
    font-size: 14px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border-radius: 8px;
    overflow: hidden;
  }

  th, td {
    border: 1px solid #ddd;
    padding: 12px;
    text-align: center;
  }

  th {
    background: #eaeaea;
    cursor: pointer;
  }

  tr:nth-child(even) {
    background: #fafafa;
  }
</style>

</head>
<body>

<h2>داشبورد نوبت‌های ثبت‌شده</h2>

<div class="toolbar">
  <input type="text" id="search" placeholder="جستجو نام یا شماره...">
  <select id="doctorFilter">
    <option value="">همه درمانگران</option>
  </select>
  <input type="date" id="dateFilter">
</div>

<table id="appointments">
  <thead>
    <tr>
      <th data-sort="name">نام</th>
      <th data-sort="family">نام‌خانوادگی</th>
      <th data-sort="doctor">درمانگر</th>
      <th data-sort="phone">شماره</th>
      <th data-sort="date">تاریخ</th>
      <th data-sort="time">ساعت</th>
      <th>ChatID</th>
    </tr>
  </thead>

  <tbody>
    {{DATA}}
  </tbody>
</table>

<script>
  const searchInput = document.getElementById("search");
  const doctorFilter = document.getElementById("doctorFilter");
  const dateFilter = document.getElementById("dateFilter");
  const table = document.getElementById("appointments").getElementsByTagName("tbody")[0];

  // استخراج درمانگران از جدول
  const doctors = new Set();
  [...table.rows].forEach(row => doctors.add(row.cells[2].innerText));

  doctors.forEach(d => {
    const opt = document.createElement("option");
    opt.value = d;
    opt.innerText = d;
    doctorFilter.appendChild(opt);
  });

  function filterTable() {
    const search = searchInput.value.toLowerCase();
    const doctor = doctorFilter.value;
    const date = dateFilter.value;

    [...table.rows].forEach(row => {
      const name = row.cells[0].innerText.toLowerCase();
      const phone = row.cells[3].innerText.toLowerCase();
      const doc = row.cells[2].innerText;
      const rowDate = row.cells[4].innerText;

      const matchSearch = name.includes(search) || phone.includes(search);
      const matchDoctor = doctor === "" || doc === doctor;
      const matchDate = date === "" || rowDate === date.replace(/-/g, "/");

      row.style.display = (matchSearch && matchDoctor && matchDate) ? "" : "none";
    });
  }

  searchInput.oninput = filterTable;
  doctorFilter.onchange = filterTable;
  dateFilter.onchange = filterTable;

  // مرتب‌سازی جدول
  document.querySelectorAll("th[data-sort]").forEach(th => {
    th.addEventListener("click", () => {
      const key = th.dataset.sort;
      const rows = [...table.rows];

      rows.sort((a, b) => {
        const A = a.querySelector(`td:nth-child(${th.cellIndex + 1})`).innerText;
        const B = b.querySelector(`td:nth-child(${th.cellIndex + 1})`).innerText;
        return A.localeCompare(B, "fa");
      });

      rows.forEach(r => table.appendChild(r));
    });
  });
</script>

</body>
</html>
