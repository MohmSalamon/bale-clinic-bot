<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لیست کاربران ربات</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Tahoma, sans-serif; max-width: 800px; margin: 20px auto; padding: 0 15px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
    th { background: #1a73e8; color: white; }
    tr:nth-child(even) { background: #f9f9f9; }
    .loading { text-align: center; padding: 50px; font-size: 18px; color: #666; }
    .counter { background: #e8f0fe; padding: 10px; border-radius: 8px; margin-bottom: 15px; }
  </style>
</head>
<body>
  <h1>📊 لیست کاربران ربات</h1>
  <div id="counter" class="counter">در حال بارگذاری...</div>
  <div id="tableContainer"><div class="loading">⏳ در حال بارگذاری...</div></div>

  <script>
    const supabaseUrl = "YOUR_SUPABASE_URL";
    const supabaseKey = "YOUR_SUPABASE_ANON_KEY";
    const supabase = supabase.createClient(supabaseUrl, supabaseKey);

    async function loadUsers() {
      const { data, error } = await supabase
        .from("users")
        .select("*")
        .order("created_at", { ascending: false });

      const container = document.getElementById("tableContainer");
      const counter = document.getElementById("counter");

      if (error) {
        container.innerHTML = `<p style="color:red;">❌ خطا: ${error.message}</p>`;
        counter.textContent = "❌ خطا در بارگذاری";
        return;
      }

      counter.textContent = `👥 تعداد کل کاربران: ${data.length}`;

      if (data.length === 0) {
        container.innerHTML = "<p>هیچ کاربری هنوز پیام نداده است.</p>";
        return;
      }

      let html = `<table>
        <thead><tr><th>#</th><th>Chat ID</th><th>نام</th><th>یوزرنیم</th><th>تاریخ</th></tr></thead><tbody>`;
      data.forEach((user, index) => {
        html += `<tr>
          <td>${index + 1}</td>
          <td><code>${user.chat_id}</code></td>
          <td>${user.first_name || "-"}</td>
          <td>${user.username || "-"}</td>
          <td>${new Date(user.created_at).toLocaleDateString("fa-IR")}</td>
        </tr>`;
      });
      html += `</tbody></table>`;
      container.innerHTML = html;
    }

    loadUsers();
  </script>
</body>
</html>
